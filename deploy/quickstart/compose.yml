name: cadence

# the easy path: postgres, the server, the dashboard and caddy in front on one host, built from this checkout.
# ./setup.sh writes the generated half of .env and runs everything; README.md has the steps
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./setup.sh first}
      POSTGRES_DB: cadence
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cadence", "-d", "cadence"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - db:/var/lib/postgresql/data
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # the master key that seals provider keys in the database: made once per volume, never replaced (a new one loses
  # every stored key), readable only by the server's nonroot user
  keygen:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    entrypoint: ["sh", "-c", "umask 077; [ -s /keys/master.key ] || head -c 32 /dev/urandom | base64 > /keys/master.key; chown 65532:65532 /keys/master.key"]
    volumes:
      - keys:/keys

  server:
    image: cadence-server:quickstart
    build:
      context: ../..
      dockerfile: server/Dockerfile
      args:
        VERSION: ${CADENCE_VERSION:-quickstart}
      # setup.sh fetches the prebuilt ffmpeg there (deploy/builder/prebuilt.sh), so the build compiles none
      additional_contexts:
        ffmpeg-server: ../../build/prebuilt/ffmpeg-server-${CADENCE_ARCH:-amd64}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cadence:${POSTGRES_PASSWORD:?run ./setup.sh first}@postgres:5432/cadence?sslmode=disable
      CADENCE_MASTER_KEY_FILE: /run/cadence/master.key
      CADENCE_PUBLIC_ORIGIN: ${CADENCE_PUBLIC_ORIGIN:?run ./setup.sh first}
      CADENCE_TRUSTED_PROXY: ${CADENCE_TRUSTED_PROXY:-172.16.0.0/12}
      CADENCE_WAKEWORD_NEGATIVES: /var/lib/cadence/wakeword/negatives.bin
      # extra CAs the server trusts for its own calls (a home assistant or a speaker with a self-signed cert); go
      # still reads the image's bundle file
      SSL_CERT_DIR: /run/cadence-ca-certs
    depends_on:
      keygen:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - keys:/run/cadence:ro
      - wakeword:/var/lib/cadence/wakeword
      - ./data/ca-certs:/run/cadence-ca-certs:ro
    read_only: true
    # the yt-dlp music player's scratch
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  dashboard:
    image: cadence-dashboard:quickstart
    build:
      context: ../..
      dockerfile: deploy/dashboard/Dockerfile
    restart: unless-stopped
    environment:
      CADENCE_API_INTERNAL: http://server:8080
    depends_on:
      - server
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # the one origin: the server's paths to the server, the rest to the dashboard (Caddyfile); https from caddy's own
  # authority by default, from let's encrypt when CADENCE_TLS is an email
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    environment:
      CADENCE_HOST: ${CADENCE_HOST:?set CADENCE_HOST in .env}
      CADENCE_HTTPS_PORT: ${CADENCE_HTTPS_PORT:-443}
      CADENCE_TLS: ${CADENCE_TLS:-internal}
    ports:
      - "${CADENCE_HTTPS_PORT:-443}:${CADENCE_HTTPS_PORT:-443}"
      - "${CADENCE_HTTP_PORT:-80}:80"
    depends_on:
      - server
      - dashboard
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  db:
  keys:
  wakeword:
  caddy-data:
  caddy-config:
