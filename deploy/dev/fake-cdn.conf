# the e2e's fake soloist cdn (device/Dockerfile.sim, target fake-cdn): the fake's release over https alone, with the
# certificate cdn-certs made from the stack's dev ca. static files carry a Content-Length and no Transfer-Encoding, as
# the updater requires
server {
    listen 443 ssl;
    server_name soloist-cdn;
    ssl_certificate /etc/cadence-cdn/leaf.crt;
    ssl_certificate_key /etc/cadence-cdn/leaf.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    access_log off;

    location ~ ^/soloist_release_[a-z0-9]+\.tar\.gz$ {
    }
    location / {
        return 404;
    }
}
