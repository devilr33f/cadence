syntax = "proto3";
package cadence.v2;

import "cadence/v2/session.proto";

option go_package = "git.shino.boo/devilreef/cadence/pkg/gen/cadence/v2;cadencev2";

enum StreamPurpose {
  STREAM_PURPOSE_UNSPECIFIED = 0;
  STREAM_PURPOSE_REPLY = 1;
  STREAM_PURPOSE_ANNOUNCE = 2;
  STREAM_PURPOSE_MEDIA = 3;
}

enum Codec {
  CODEC_UNSPECIFIED = 0;
  CODEC_OPUS = 1;
}

message StreamStart {
  string stream_id = 1;
  string session_id = 2;
  StreamPurpose purpose = 3;
  Codec codec = 4;
  uint32 channels = 5;
  bool duck = 6;
  // the server's span that made the stream (the turn's tts): the device's playback span is its child
  TraceContext trace = 7;
}

message AudioDown {
  string stream_id = 1;
  uint32 seq = 2;
  bytes opus = 3;
}

message StreamEnd {
  string stream_id = 1;
}
